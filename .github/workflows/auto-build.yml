name: Instant Deploy from Google Sheets Webhook

on:
  # Menerima sinyal webhook dari Google Apps Script
  repository_dispatch:
    types: [sheet_updated]
  
  # Tombol manual jaga-jaga
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      # Jika Anda menggunakan integrasi otomatis Cloudflare Pages via GitHub, 
      # proses build di atas otomatis mengirim hasil terbarunya ke Cloudflare.
      - name: Success Notification
        run: echo "Website berhasil di-update secara instan karena perubahan data Google Sheets!"